# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: Install this plugin locally (runs install:symlink)
    cmds:
      - task: install:symlink
  install:symlink:
    desc: Symlink the plugin into ~/.agents/plugins, and add/update the Cursor marketplace
    cmds:
      - ./.github/scripts/install-symlinks.sh
  refresh:
    desc: Refresh the installed plugin in Claude Code and Cursor from the git remote (push first)
    cmds:
      - ./.github/scripts/refresh-clients.sh
  sync:
    desc: Sync remote skills from remotes.yaml into the repo's skills/ directory
    cmds:
      - ./.github/scripts/update-remotes.py
  up:
    desc: Update remotes.yaml commit SHAs to HEAD and sync into repo
    cmds:
      - ./.github/scripts/update-remotes.py --update

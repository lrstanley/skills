# yaml-language-server: $schema=.github/schemas/remotes.json
remotes:
  - name: cursor-plugins
    git_url: https://github.com/cursor/plugins.git
    commit_sha: ec44aed93cda65227954d46c75be3a2f218144a3
    patches:
      - .github/patches/nuclear-review-rename.patch
    file_filters:
      # pr-review-canvas
      - src: cursor-team-kit/skills/pr-review-canvas/**
        dest: pr-review-canvas/
      - src: cursor-team-kit/LICENSE
        dest: pr-review-canvas/LICENSE
      # thermo-nuclear-code-quality-review
      - src: cursor-team-kit/skills/thermo-nuclear-code-quality-review/**
        dest: nuclear-review/
      - src: cursor-team-kit/LICENSE
        dest: nuclear-review/LICENSE

  - name: mattpocock
    git_url: https://github.com/mattpocock/skills.git
    commit_sha: e3b90b5238f38cdea5996e16861dcae28ef52eda
    patches:
      - .github/patches/grill-me-preferred-answers.patch
      - .github/patches/handoff-disable-model-invocation.patch
    file_filters:
      - src: skills/productivity/grill-me/**
        dest: grill-me/
      - src: LICENSE
        dest: grill-me/LICENSE
      - src: skills/productivity/handoff/**
        dest: handoff/
      - src: LICENSE
        dest: handoff/LICENSE
